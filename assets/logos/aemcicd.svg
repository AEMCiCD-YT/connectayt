<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="aemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4036" />
      <stop offset="100%" stop-color="#25628f" />
    </linearGradient>
    <filter id="aemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Fondo redondeado con sutil contraste -->
  <rect width="240" height="240" rx="48" fill="#ffffff" />
  
  <!-- Estructura Gráfica AEMCiCD: Nodos de Ciencia de Datos y Red Neuronal / Grafo Matemático -->
  <g transform="translate(20, 20)">
    <!-- Red de Conexiones -->
    <path d="M 50 100 L 100 45 L 150 100 L 100 155 Z" fill="none" stroke="#25628f" stroke-width="6" stroke-linejoin="round" opacity="0.85" />
    <path d="M 50 100 L 150 100" stroke="#ef4036" stroke-width="5" stroke-dasharray="4,4" />
    <path d="M 100 45 L 100 155" stroke="#ef4036" stroke-width="5" />

    <!-- Nodos del Grafo -->
    <circle cx="100" cy="45" r="14" fill="#ef4036" />
    <circle cx="100" cy="45" r="7" fill="#ffffff" />

    <circle cx="50" cy="100" r="14" fill="#25628f" />
    <circle cx="50" cy="100" r="7" fill="#ffffff" />

    <circle cx="150" cy="100" r="14" fill="#25628f" />
    <circle cx="150" cy="100" r="7" fill="#ffffff" />

    <circle cx="100" cy="155" r="14" fill="#ef4036" />
    <circle cx="100" cy="155" r="7" fill="#ffffff" />

    <!-- Núcleo Central de Datos -->
    <circle cx="100" cy="100" r="10" fill="url(#aemGrad)" filter="url(#aemShadow)" />

    <!-- Texto AEMCiCD Tipográfico Base -->
    <text x="100" y="190" text-anchor="middle" font-family="'Outfit', 'DM Sans', sans-serif" font-weight="900" font-size="24" fill="#0f172a" letter-spacing="1">AEMCiCD</text>
  </g>
</svg>
